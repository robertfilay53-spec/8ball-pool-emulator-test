name: Emulator smoke test - 8 Ball Pool boot + libgame dump

on:
  workflow_dispatch:

jobs:
  emulator-dump:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repo (for smoke-test.sh)
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run emulator + smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          cores: 4
          ram-size: 6144M
          heap-size: 1024M
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          emulator-boot-timeout: 600
          # Single command: the runner executes `script:` LINE BY LINE via
          # `sh -c <line>`, which breaks multi-line if/then/fi blocks (run #1
          # died on `if [ -n "$GAME_PID" ]; then`). All logic lives in
          # smoke-test.sh, run here as one line.
          script: bash smoke-test.sh

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-smoke-test-results
          path: |
            logs/
            dump/
          retention-days: 1
          if-no-files-found: warn
